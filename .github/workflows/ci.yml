name: CI

on:
  push:
    branches: [main]
  pull_request:

# When a new commit lands on a branch/PR, cancel the in-flight run for the
# same ref instead of letting it run to completion on a wasted runner — most
# of the cost (a full race-enabled test compile) is duplicated on every push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true

      # main.go embeds dist/ via //go:embed all:dist, so vet/test can't
      # compile the root package without the directory existing — a real
      # frontend build isn't needed for that, just a placeholder file. The
      # actual build is exercised by the frontend job below, kept independent
      # so both jobs run in parallel.
      - name: Stub embedded frontend directory
        run: mkdir -p dist && touch dist/index.html

      - name: Vet
        run: go vet ./...

      - name: Test
        # The default go test timeout is 10m; -race's overhead already put
        # the suite close to that on CI's shared runners before Phase 7's
        # inventory/COGS GL tests (more DB fixtures, each running its own
        # migration) added enough to tip it over — bump the budget rather
        # than the suite's actual runtime being the problem.
        run: go test -race -timeout=20m ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # --prod so a moderate advisory in the dev-only chain doesn't block a
        # release; high threshold to fail only on genuinely serious findings.
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
