name: CI

on:
  push:
    branches: [main]
  pull_request:

# When a new commit lands on a branch/PR, cancel the in-flight run for the
# same ref instead of letting it run to completion on a wasted runner — most
# of the cost (a full race-enabled test compile) is duplicated on every push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true

      # main.go embeds dist/ via //go:embed all:dist, so vet/test can't
      # compile the root package without the directory existing — a real
      # frontend build isn't needed for that, just a placeholder file. The
      # actual build is exercised by the frontend job below, kept independent
      # so both jobs run in parallel.
      - name: Stub embedded frontend directory
        run: mkdir -p dist && touch dist/index.html

      - name: Vet
        run: go vet ./...

      - name: Test
        # The default go test timeout is 10m; -race's overhead already put
        # the suite close to that on CI's shared runners before Phase 7's
        # inventory/COGS GL tests (more DB fixtures, each running its own
        # migration) added enough to tip it over — bump the budget rather
        # than the suite's actual runtime being the problem. Raised again
        # 2026-09-09: the most recent successful run on main (v3.14.0's
        # merge) already spent 16m04s of the 20m budget before 3 small,
        # fast (0.05s locally) tests from PR #170 were enough to tip a
        # later run into a 20m timeout — every `newTestDB` call runs the
        # full migration set against a fresh on-disk SQLite file with real
        # fsyncs, so per-test overhead scales with the growing migration
        # count, not with what any individual test actually asserts. Same
        # "bump the budget" call as before, with more headroom this time
        # since the suite is only going to keep growing test-by-test.
        # Partially addressed the same day: every db-package test now calls
        # t.Parallel() (each gets its own on-disk SQLite file via
        # newTestDB/t.TempDir(), so they're fully isolated) — ~40% faster
        # locally (392s -> ~230-270s for the db package alone). Left the 28m
        # budget as-is rather than tightening it back down: this was only
        # measured on one local machine, and CI's shared runners may see
        # less benefit from parallelism (fewer cores, or -race's per-goroutine
        # memory overhead capping effective concurrency) than this did.
        # -coverprofile writes per-line coverage alongside -race/-timeout
        # rather than as a separate run, since a second full `go test`
        # invocation would double the job's runtime for no reason.
        run: go test -race -timeout=28m -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        # Printed to the job log for a quick read without downloading the
        # artifact — deliberately no enforced minimum-coverage threshold
        # here: picking a number low enough not to immediately fail on
        # today's actual coverage, or high enough to mean something, is a
        # policy call for the repo owner to make once there's a real number
        # to react to, not one to bake in alongside the reporting itself.
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 30

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # --prod so a moderate advisory in the dev-only chain doesn't block a
        # release; high threshold to fail only on genuinely serious findings.
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
