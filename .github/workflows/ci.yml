name: CI

on:
  push:
    branches: [main]
  pull_request:

# When a new commit lands on a branch/PR, cancel the in-flight run for the
# same ref instead of letting it run to completion on a wasted runner — most
# of the cost (a full race-enabled test compile) is duplicated on every push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true

      # main.go embeds dist/ via //go:embed all:dist, so vet/test can't
      # compile the root package without the directory existing — a real
      # frontend build isn't needed for that, just a placeholder file. The
      # actual build is exercised by the frontend job below, kept independent
      # so both jobs run in parallel.
      - name: Stub embedded frontend directory
        run: mkdir -p dist && touch dist/index.html

      - name: Check formatting
        # Passes today, so gating it costs nothing and stops unformatted Go
        # reaching main (audit 2026-09-14 F82). gofmt -l prints offending
        # files and exits 0, so the file list itself has to be the failure
        # signal.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        # History of this timeout, oldest to newest: raised from the 10m
        # default once -race pushed the suite close to it; raised again to
        # 28m on 2026-09-09 when a run on main spent 16m04s of a 20m budget
        # before 3 small new tests tipped a later run over — every
        # `newTestDB` call ran the full migration set against a fresh
        # on-disk SQLite file, so per-test overhead scaled with the growing
        # migration count, not with what any test actually asserted.
        # Two fixes landed the same day, in order:
        # 1. Every db-package test gained t.Parallel() (each already got its
        #    own on-disk file via newTestDB/t.TempDir(), so isolation was
        #    free) — ~40% faster locally (392s -> ~230-270s for the db
        #    package alone). Left the 28m budget as-is rather than
        #    tightening it: this was measured on one local machine, and
        #    CI's shared runners might see less benefit from parallelism.
        #    It didn't — CI's own `go` job ran in 8m49s afterward, confirming
        #    the speedup held there too.
        # 2. newTestDB itself was rebuilt around a cached golden migrated
        #    database (db_test.go's goldenMigratedDB, built once per test
        #    binary run via Backup/VACUUM INTO — the same primitive db.go
        #    already uses for production backups) instead of running
        #    golang-migrate's Up() fresh every time. Measured under -race:
        #    NewDatabase (open + migrate) cost ~1.44s/call — every migration
        #    statement is race-instrumented — versus ~20ms/call to copy
        #    pre-migrated bytes into a new file and let Up() no-op against
        #    an already-current schema. That took the db package alone from
        #    ~230-270s to ~9s locally — the actual bottleneck was never
        #    fsync/disk I/O (a synchronous=OFF experiment on the test DSN
        #    made no measurable difference); it was -race instrumenting 70
        #    migrations' worth of statements on every single test.
        # The 28m budget is left unchanged again: it was never the actual
        # constraint (even before this, no observed run got close to it),
        # and there's no cost to carrying slack now that the api package
        # (no equivalent optimization — api/restore_test.go's newTestRouter
        # calls db.NewDatabase directly, a decent follow-up) is the slower
        # of the two Go packages.
        # -coverprofile writes per-line coverage alongside -race/-timeout
        # rather than as a separate run, since a second full `go test`
        # invocation would double the job's runtime for no reason.
        run: go test -race -timeout=28m -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        # Printed to the job log for a quick read without downloading the
        # artifact — deliberately no enforced minimum-coverage threshold
        # here: picking a number low enough not to immediately fail on
        # today's actual coverage, or high enough to mean something, is a
        # policy call for the repo owner to make once there's a real number
        # to react to, not one to bake in alongside the reporting itself.
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 30

      - name: Vulnerability scan
        # govulncheck exits 3 (not just nonzero-on-error) whenever it finds a
        # vulnerability actually *called* by this code — every PR since
        # issue #257 has failed here on GO-2026-6452 (a panic in excelize's
        # DuplicateRowTo/GetRows, both called from db/xlsx_export.go), which
        # has no fix available upstream ("Fixed in: N/A") and was triaged as
        # non-blocking, requiring a `gh pr merge --admin` bypass every time
        # instead of an honest green check. This allowlists specifically
        # that finding and nothing else: any *other* vulnerability id still
        # fails the job. Text output (not -json, which always exits 0
        # regardless of findings — useless as a pass/fail signal on its own)
        # is parsed for "Vulnerability #N: GO-..." lines, which only appear
        # for a called vulnerability — govulncheck's own "imported/required
        # but never called" findings are reported separately and never cause
        # a nonzero exit, so they need no allowlist entry here.
        run: |
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... > govulncheck-output.txt 2>&1
          exit_code=$?
          set -e
          cat govulncheck-output.txt

          # Known, already-triaged findings with no upstream fix (issue link
          # in the comment for each). Adding a real vulnerability here to
          # silence CI defeats the point — only add one after confirming
          # there's genuinely no fixed version to upgrade to.
          allowed_ids="GO-2026-6452" # excelize DuplicateRowTo/GetRows panic, issue #257 — no fix upstream

          if [ "$exit_code" -eq 0 ]; then
            exit 0
          fi

          found_ids=$(grep -oE '^Vulnerability #[0-9]+: GO-[0-9]+-[0-9]+' govulncheck-output.txt | grep -oE 'GO-[0-9]+-[0-9]+')

          if [ -z "$found_ids" ]; then
            echo "::error::govulncheck exited $exit_code with no vulnerability reported — likely a scan/build error, not a known finding"
            exit "$exit_code"
          fi

          unexpected=""
          for id in $found_ids; do
            case " $allowed_ids " in
              *" $id "*) ;;
              *) unexpected="$unexpected $id" ;;
            esac
          done

          if [ -n "$unexpected" ]; then
            echo "::error::new/unaccepted vulnerabilities found (not in the allowlist):$unexpected"
            exit 1
          fi

          echo "Only known, already-triaged vulnerabilities found, not blocking:$found_ids"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # --prod so a moderate advisory in the dev-only chain doesn't block a
        # release; high threshold to fail only on genuinely serious findings.
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # Catalog drift is this repo's own recurring failure mode: issue #216
      # found 80 messages missing from the catalogs because `pnpm extract`
      # had not been re-run, 12 of them missing from English too. Extracting
      # in CI and failing on a dirty tree means a new string can't reach main
      # without its catalog entry (audit 2026-09-14 F82).
      #
      # This checks only that the catalogs are *complete and current*, not
      # that every entry is translated — an untranslated msgstr falls back to
      # the source text, which is a product decision, not a build break.
      - name: Check translation catalogs are up to date
        run: |
          pnpm extract
          if ! git diff --quiet -- src/locales/; then
            echo "Translation catalogs are stale. Run 'pnpm extract' and commit the result:" >&2
            git --no-pager diff --stat -- src/locales/ >&2
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # F137: until this job existed, nothing on a PR ever touched the
  # Dockerfile — docker.yml only runs on `push: tags: v*`, so Dockerfile or
  # compose breakage was found at release time instead of on the PR that
  # introduced it. Only the `backend` target is built here, deliberately:
  # the full runtime stage installs libreoffice-calc (~630MB) and would make
  # every PR unusably slow. The backend target still exercises everything in
  # the Dockerfile a code change can break — the frontend pnpm build, the Go
  # compile (including the `dist/` embed) — so Dockerfile rot is caught
  # without paying for the runtime stage.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build backend image target
        run: docker build --target backend -t fatura-cloud-ci:test --build-arg VERSION=ci .

      # Both compose files are validated here too — `config` parses,
      # interpolates and resolves them without building or pulling anything,
      # so a broken compose change (bad YAML, dropped service, a merge that
      # no longer type-checks) fails on the PR. Warnings about unset
      # JWT_SECRET/ADMIN_PASSWORD/DOMAIN etc. are expected and not errors.
      - name: Validate compose files
        run: |
          docker compose config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.oidc.yml config > /dev/null
