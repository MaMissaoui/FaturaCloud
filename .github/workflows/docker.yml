name: Build and publish Docker image

on:
  push:
    tags:
      - "v*"

# Releases are single-shot, append-only tag pushes — only one can be in
# flight at a time. Group by workflow so an overlapping tag push cancels
# nothing legitimate (each tag is its own manual action), but tags pushed
# back-to-back don't build two images against a half-written cache.
concurrency:
  group: docker-${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/mamissaoui/fatura-cloud

jobs:
  # One job per platform, each on its own *native* runner — arm64 builds on
  # a real arm64 machine instead of amd64+QEMU. Confirmed via the v3.14.0
  # release build: the debian runtime stage's `apt-get install
  # libreoffice-calc` (real package unpacking/postinst work, not something
  # Go's cross-compilation trick below can route around) took 4m31s under
  # QEMU emulation vs. 36s native — the dominant cost in the whole build.
  # linux/arm64 hosted runners are free for public repos, so this is a pure
  # win with no billing tradeoff on this repo. Each leg builds and pushes
  # its own image *by digest only* (no tags yet) — the `merge` job below
  # combines both digests into the one multi-arch manifest every existing
  # tag (version, major.minor, sha) points at, matching Docker's own
  # documented "distribute build across multiple runners" pattern.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only here — the actual tags (version, major.minor, sha) are
      # applied once, in the merge job, to the combined manifest list. A
      # per-platform image only ever needs to be addressable by digest.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          # Conditional rather than always passing sentry_auth_token=<empty> —
          # Buildx warns "sentry_auth_token= is not a valid secret" on every
          # build when the repo secret is unset (true on a fork, or before
          # it's configured here), even though the frontend build already
          # treats a missing token as "skip the upload" on its own (see the
          # Docker section in CLAUDE.md). Passing no secrets input at all
          # when the token is empty avoids the warning without changing
          # behavior either way.
          secrets: ${{ secrets.SENTRY_AUTH_TOKEN != '' && format('sentry_auth_token={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per platform now that each builds on its own runner —
          # sharing one scope across two architectures' layer caches would
          # mean every push evicts the other platform's cache instead of
          # reusing it. Still capped and namespaced away from CI's Go build
          # cache, same reasoning as before.
          cache-from: type=gha,scope=docker-release-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=docker-release-${{ env.PLATFORM_PAIR }},mode=max,size-limit=8g

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the two per-platform digests from above into one multi-arch
  # manifest list and applies every real tag to it in one step — this is
  # the only job that ever writes a named tag, so `latest`/the version tags
  # always point at a manifest covering both platforms, never a
  # single-platform image.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${{ env.IMAGE_NAME }}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      # Every multi-arch push adds 3 package versions (manifest list + one
      # per platform) that are never superseded, since each git tag gets its
      # own immutable image tag — left alone this grows GHCR storage forever
      # (confirmed on stbvirement's sibling package: 285 versions after ~3
      # months with no pruning). Keep only the most recent releases; older
      # per-platform children are pruned automatically once their manifest
      # list is gone.
      - name: Prune old GHCR image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          # Defaults to the repo name (FaturaCloud) — the actual package is
          # registered lowercase, so the default 404s against the registry API.
          package: fatura-cloud
          keep-n-tagged: 15
          delete-untagged: true
          delete-partial-images: true
          # ghcr.io/mamissaoui/fatura-cloud is a user-owned package (personal
          # account, not an org) — the default GITHUB_TOKEN cannot delete
          # versions of a user-owned package via the packages API regardless
          # of this job's `permissions: packages: write` (confirmed via a
          # real release log: every DELETE call 404s, which this action's
          # own error handling silently treats as "already deleted" — so
          # this step has actually been a no-op on every release since it
          # was added in #171, not just on the throwaway-tag test that first
          # surfaced it). GHCR_CLEANUP_TOKEN is a classic PAT scoped to
          # read:packages + delete:packages, which a personal-account
          # package does require.
          token: ${{ secrets.GHCR_CLEANUP_TOKEN }}

  release:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The "chore: release vX.Y.Z" PR that precedes every tag adds a
      # matching "## [X.Y.Z]" section to CHANGELOG.md — reuse it as the
      # release body instead of duplicating the notes. Falls back to GitHub's
      # auto-generated notes if a tag was pushed without one.
      - name: Extract changelog section for this tag
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if ($0 ~ ("\\[" ver "\\]")) { found=1; next } else { next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file release-notes.md
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
