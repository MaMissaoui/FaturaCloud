name: Build and publish Docker image

on:
  push:
    tags:
      - "v*"

# Releases are single-shot, append-only tag pushes — only one can be in
# flight at a time. Group by workflow so an overlapping tag push cancels
# nothing legitimate (each tag is its own manual action), but tags pushed
# back-to-back don't build two images against a half-written cache.
concurrency:
  group: docker-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/mamissaoui/fatura-cloud
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          # The GHA cache shares the repo's 10 GB actions-cache budget with
          # CI's Go build cache. Multi-arch layer caches grow fast; scope this
          # cache to the docker workflow and cap it so an oversized release
          # build can't evict the Go cache that CI depends on for its speed.
          cache-from: type=gha,scope=docker-release
          cache-to: type=gha,scope=docker-release,mode=max,size-limit=8g

      # Every multi-arch push adds 3 package versions (manifest list + one
      # per platform) that are never superseded, since each git tag gets its
      # own immutable image tag — left alone this grows GHCR storage forever
      # (confirmed on stbvirement's sibling package: 285 versions after ~3
      # months with no pruning). Keep only the most recent releases; older
      # per-platform children are pruned automatically once their manifest
      # list is gone.
      - name: Prune old GHCR image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          # Defaults to the repo name (FaturaCloud) — the actual package is
          # registered lowercase, so the default 404s against the registry API.
          package: fatura-cloud
          keep-n-tagged: 15
          delete-untagged: true
          delete-partial-images: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The "chore: release vX.Y.Z" PR that precedes every tag adds a
      # matching "## [X.Y.Z]" section to CHANGELOG.md — reuse it as the
      # release body instead of duplicating the notes. Falls back to GitHub's
      # auto-generated notes if a tag was pushed without one.
      - name: Extract changelog section for this tag
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if ($0 ~ ("\\[" ver "\\]")) { found=1; next } else { next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file release-notes.md
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
